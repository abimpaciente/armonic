services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Storage directory for hymns, MIDI files, and Audiveris temp outputs
      ARMONIC_STORAGE: /app/storage

      # OMR / Audiveris configuration
      # Audiveris is now built into the Docker image
      AUDIVERIS_BIN: /usr/local/bin/audiveris

      # Max upload size (MB)
      ARMONIC_MAX_UPLOAD_MB: 25

    volumes:
      # Persist hymns and MIDI files across container restarts
      - storage:/app/storage

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # (Optional) Frontend service - uncomment to run Angular dev server in Docker
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   ports:
  #     - "4200:4200"
  #   volumes:
  #     - ./frontend/src:/app/src
  #     - ./frontend/public:/app/public
  #   depends_on:
  #     - backend
  #   environment:
  #     - API_URL=http://backend:8000

volumes:
  storage:
    driver: local
